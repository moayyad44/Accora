<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f172a;
    color: #e2e8f0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
  }
  .box { text-align: center; }
  .title { font-size: 22px; font-weight: 700; margin-bottom: 18px; color: #60a5fa; }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 16px;
    border: 3px solid #334155;
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  #status { font-size: 13px; color: #94a3b8; min-height: 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="title">أكورا</div>
    <div class="spinner"></div>
    <div id="status">جاري التشغيل...</div>
  </div>
  <script>
    const { ipcRenderer } = require("electron");
    ipcRenderer.on("status", (_event, message) => {
      document.getElementById("status").textContent = message;
    });
  </script>
</body>
</html>
