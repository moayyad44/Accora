# Mirrors apps/web/vite.config.ts's dev proxy: the SPA calls /api/*, which
# gets forwarded to the API container with the /api prefix stripped (the
# trailing slash on both `location` and `proxy_pass` does the stripping).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BrowserRouter client-side routing — any path that isn't a real static
    # file falls back to index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
